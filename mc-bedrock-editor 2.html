<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC Bedrock Editor</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── Reset & vars ─── */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e1116;--bg2:#161b22;--bg3:#1c232d;--bg4:#20282f;
  --bdr:#2d353f;--bdr2:#3a444e;
  --grn:#39d353;--gdim:#0d2818;--gbright:#56ef70;
  --blu:#58a6ff;--yel:#e3b341;--red:#f85149;--ora:#ffa657;
  --pur:#d2a8ff;--cya:#39d4c8;
  --txt:#cdd9e5;--mut:#768390;--dim:#444c56;
  --mono:'Fira Code',monospace;--pix:'VT323',monospace;
  --sb-w:256px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;}
button{font-family:var(--mono);cursor:pointer;}
input,textarea,select{font-family:var(--mono);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bdr2);}

/* ─── Header ─── */
.hdr{
  height:40px;background:var(--bg2);border-bottom:2px solid var(--grn);
  display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;
  box-shadow:0 2px 12px #39d35318;
}
.logo{font-family:var(--pix);font-size:24px;color:var(--grn);letter-spacing:4px;text-shadow:0 0 12px #39d35366;}
.logo-sub{font-size:9px;color:var(--mut);letter-spacing:.5px;margin-left:-4px;}
.badge{font-size:9px;padding:1px 7px;border:1px solid;letter-spacing:.5px;}
.badge-g{color:var(--grn);border-color:#39d35344;background:var(--gdim);}
.badge-b{color:var(--blu);border-color:#58a6ff33;background:#0c1826;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:9px;color:var(--dim);}
.hdr-right b{color:var(--grn);}

/* ─── App layout ─── */
.app{display:flex;flex:1;overflow:hidden;min-height:0;}

/* ─── Sidebar ─── */
.sb{
  width:var(--sb-w);flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;
}

/* World picker */
.world-bar{
  height:34px;border-bottom:1px solid var(--bdr);padding:0 9px;
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  cursor:pointer;user-select:none;position:relative;transition:background .1s;
}
.world-bar:hover{background:var(--bg3);}
.world-name{font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--grn);}
.world-caret{font-size:9px;color:var(--mut);transition:transform .15s;}
.world-bar.open .world-caret{transform:rotate(180deg);}
.world-drop{
  position:absolute;top:100%;left:0;right:0;z-index:90;
  background:var(--bg3);border:1px solid var(--bdr2);border-top:none;
  display:none;max-height:210px;overflow-y:auto;
  box-shadow:0 8px 24px #00000066;
}
.world-drop.open{display:block;}
.wdrop-item{
  padding:5px 10px;font-size:10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .08s;
}
.wdrop-item:hover{background:var(--bdr);}
.wdrop-item.active{color:var(--grn);}
.wdrop-none{padding:8px 10px;font-size:9px;color:var(--mut);font-style:italic;}

/* Upload zone */
.upload{
  margin:6px 7px;border:1px dashed var(--bdr2);text-align:center;
  padding:8px 6px;cursor:pointer;position:relative;transition:all .18s;flex-shrink:0;
}
.upload:hover,.upload.drag{border-color:var(--grn);background:var(--gdim);}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-lbl{display:block;font-size:10px;color:var(--grn);margin:2px 0 1px;}
.upload-hint{font-size:8px;color:var(--mut);line-height:1.5;}

/* Tree toolbar */
.tree-bar{
  height:27px;border-bottom:1px solid var(--bdr);padding:0 8px;
  display:flex;align-items:center;gap:2px;flex-shrink:0;
}
.tree-title{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;flex:1;}
.tbb{
  background:none;border:1px solid transparent;padding:1px 5px;
  font-size:9px;color:var(--mut);display:flex;align-items:center;gap:2px;
  transition:all .1s;line-height:1.4;
}
.tbb:hover{border-color:var(--grn);color:var(--grn);}
.tbb.red:hover{border-color:var(--red);color:var(--red);}

/* Inline add-file row */
.add-row{
  display:none;align-items:center;gap:3px;
  padding:3px 7px;border-bottom:1px solid var(--bdr);
  background:var(--gdim);flex-shrink:0;
}
.add-row.show{display:flex;}
.add-input{
  flex:1;background:var(--bg);border:1px solid var(--grn);
  color:var(--txt);font-size:10px;padding:2px 5px;outline:none;min-width:0;
}
.add-input::placeholder{color:var(--mut);}
.add-btn{
  background:none;border:1px solid transparent;padding:1px 4px;
  color:var(--mut);display:flex;align-items:center;transition:all .1s;
}
.add-btn:hover{border-color:var(--grn);color:var(--grn);}
.add-btn.cancel:hover{border-color:var(--red);color:var(--red);}

/* File tree */
.tree-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:10px;}

/* Tree nodes */
.tr{
  display:flex;align-items:center;height:22px;padding-right:6px;
  cursor:pointer;border-left:2px solid transparent;
  position:relative;white-space:nowrap;transition:background .06s;
  user-select:none;
}
.tr:hover{background:var(--bg3);}
.tr.sel{background:var(--bg4);border-left-color:var(--grn);}
.tr:hover .tr-acts{opacity:1;}
/* indent spacer */
.tr-sp{display:inline-block;flex-shrink:0;}
/* toggle arrow */
.tr-arr{
  width:13px;flex-shrink:0;font-size:8px;color:var(--mut);
  text-align:center;transition:transform .1s;
}
.tr-arr.open{transform:rotate(90deg);}
/* file/folder icon */
.tr-ico{
  flex-shrink:0;font-size:8px;font-weight:600;padding:1px 3px;
  border-radius:2px;min-width:22px;text-align:center;margin-right:4px;
}
.ico-dir {background:#251d0e;color:var(--ora);}
.ico-json{background:#0c1a28;color:var(--blu);}
.ico-img {background:#0c2218;color:var(--grn);}
.ico-dat {background:#1c1228;color:var(--pur);}
.ico-txt {background:#141a22;color:#79c0ff;}
.ico-db  {background:#18102a;color:var(--pur);}
.ico-fn  {background:#251d0e;color:var(--yel);}
.ico-zip {background:#0e1e12;color:var(--cya);}
.ico-bin {background:#161616;color:var(--mut);}
/* filename */
.tr-name{font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
.tr-name.dirty{color:var(--yel);}
.tr-name.new{color:var(--grn);}
/* size hint */
.tr-sz{font-size:8px;color:var(--dim);flex-shrink:0;margin-right:3px;}
/* hover action buttons */
.tr-acts{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  display:flex;gap:1px;opacity:0;transition:opacity .1s;
  background:var(--bg4);padding:1px 2px;
}
.tr-act{
  background:none;border:none;padding:1px 3px;font-size:9px;
  color:var(--mut);display:flex;align-items:center;transition:color .1s;
}
.tr-act:hover{color:var(--grn);}
.tr-act.del:hover{color:var(--red);}
/* dir children */
.tr-children{display:block;}
.tr-children.collapsed{display:none;}
/* empty tree */
.tree-empty{padding:16px 12px;color:var(--mut);font-size:9px;text-align:center;line-height:2;}

/* ─── Main panel ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* Tab bar */
.tabs{
  height:36px;background:var(--bg2);border-bottom:1px solid var(--bdr);
  display:flex;align-items:flex-end;overflow-x:auto;flex-shrink:0;
}
.tab{
  height:36px;padding:0 14px;background:none;border:none;
  color:var(--mut);font-size:10px;white-space:nowrap;
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  border-bottom:2px solid transparent;transition:all .1s;
}
.tab:hover{color:var(--txt);background:var(--bg3);}
.tab.act{color:var(--grn);border-bottom-color:var(--grn);}
.tab-close{
  width:14px;height:14px;background:none;border:none;padding:0;
  color:var(--mut);display:flex;align-items:center;justify-content:center;
  border-radius:2px;font-size:10px;transition:all .1s;margin-left:2px;
}
.tab-close:hover{background:var(--bdr2);color:var(--red);}
/* when no files open */
.tabs-hint{padding:8px 14px;font-size:9px;color:var(--dim);font-style:italic;align-self:center;}

/* Editor area */
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* Toolbar above editor */
.etoolbar{
  height:32px;background:var(--bg2);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0;
}
.etoolbar.hide{display:none;}
.epath{font-size:10px;color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.epath span{color:var(--grn);}
.ebtn{
  background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);
  padding:2px 9px;font-size:10px;display:flex;align-items:center;gap:4px;
  transition:all .1s;white-space:nowrap;
}
.ebtn:hover{border-color:var(--grn);color:var(--grn);}
.ebtn.prim{background:var(--gdim);border-color:var(--grn);color:var(--grn);}
.ebtn.prim:hover{background:#0f3520;}
.ebtn.danger{color:var(--red);border-color:#f8514933;}
.ebtn.danger:hover{border-color:var(--red);background:#1a0808;}
.ebtn:disabled{opacity:.35;pointer-events:none;}
.esep{width:1px;height:16px;background:var(--bdr);}

/* Error bar under toolbar */
.ebar{
  padding:3px 10px;font-size:9px;display:none;flex-shrink:0;
}
.ebar.err{background:#1a0808;color:var(--red);display:block;}
.ebar.ok{background:#0d2818;color:var(--grn);display:block;}

/* Editor views */
.eview{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* Text editor */
.text-editor{
  flex:1;background:var(--bg);color:var(--txt);border:none;outline:none;
  font-size:12px;resize:none;padding:10px 12px;line-height:1.65;
  tab-size:2;min-height:0;
}
/* Image viewer */
.img-view{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:20px;overflow:auto;
  background:var(--bg);
}
.img-view img{
  max-width:min(100%,400px);max-height:300px;
  object-fit:contain;image-rendering:pixelated;
  border:1px solid var(--bdr);background:#111;
}
.img-meta{font-size:9px;color:var(--mut);text-align:center;line-height:1.8;}
/* Hex viewer */
.hex-view{flex:1;overflow-y:auto;padding:10px 12px;background:var(--bg);font-size:11px;line-height:1.7;}
.hex-row{display:flex;gap:14px;}
.hex-off{color:var(--dim);width:38px;flex-shrink:0;}
.hex-bytes{color:var(--blu);flex:1;letter-spacing:.4px;}
.hex-ascii{color:var(--mut);}
/* JSON special view */
.json-info{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
/* Welcome / empty */
.welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--mut);
  background:var(--bg);
}
.welcome h2{font-family:var(--pix);font-size:28px;color:var(--dim);letter-spacing:4px;}
.welcome p{font-size:10px;line-height:1.8;text-align:center;}
.welcome code{color:var(--grn);background:var(--gdim);padding:1px 5px;}

/* NBT badge info panel */
.nbt-panel{flex:1;overflow-y:auto;padding:10px 12px;background:var(--bg);}
.nbt-kv{display:grid;grid-template-columns:1fr 2fr;gap:2px 10px;font-size:10px;}
.nbt-k{color:var(--mut);padding:2px 0;}
.nbt-v{color:var(--txt);padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nbt-v.s{color:var(--grn);}
.nbt-v.n{color:var(--blu);}
.nbt-notice{
  margin:10px 0;padding:8px 10px;background:var(--bg3);border-left:3px solid var(--yel);
  font-size:9px;color:var(--mut);line-height:1.8;
}

/* Status bar */
.status{
  height:22px;background:var(--gdim);border-top:1px solid var(--grn);
  display:flex;align-items:center;padding:0 10px;gap:12px;flex-shrink:0;
  font-size:9px;color:var(--grn);
}
.status-msg{}
.status-mod{color:var(--yel);display:none;}
.status-mod.show{display:block;}
.status-right{margin-left:auto;color:var(--mut);}
.status-wasm{color:var(--dim);}

/* Overlay loader */
#loader{
  position:fixed;inset:0;background:#0e1116cc;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;z-index:999;
}
#loader.show{display:flex;}
.loader-text{font-family:var(--pix);font-size:22px;color:var(--grn);text-shadow:0 0 12px #39d35366;}
.loader-sub{font-size:9px;color:var(--mut);max-width:260px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@keyframes blink{50%{opacity:0;}}.loader-dot{animation:blink .8s infinite;}

/* Confirm dialog */
.dialog-bg{position:fixed;inset:0;background:#00000088;display:none;align-items:center;justify-content:center;z-index:998;}
.dialog-bg.show{display:flex;}
.dialog{background:var(--bg3);border:1px solid var(--bdr2);padding:20px 22px;min-width:280px;max-width:400px;}
.dialog h3{font-family:var(--pix);font-size:18px;color:var(--yel);letter-spacing:2px;margin-bottom:10px;}
.dialog p{font-size:10px;color:var(--mut);line-height:1.8;margin-bottom:14px;}
.dialog-btns{display:flex;gap:6px;justify-content:flex-end;}

/* Rename input */
.rename-row{
  display:none;align-items:center;gap:4px;
  padding:3px 8px;background:var(--bg3);
  border-bottom:1px solid var(--bdr);flex-shrink:0;
}
.rename-row.show{display:flex;}
.rename-lbl{font-size:9px;color:var(--mut);flex-shrink:0;}
.rename-input{flex:1;background:var(--bg);border:1px solid var(--grn);color:var(--txt);font-size:10px;padding:2px 5px;outline:none;}

/* SVG icons inline helper */
svg.icon{display:inline-block;vertical-align:middle;flex-shrink:0;}
</style>
</head>

<!-- Loader overlay -->
<div id="loader">
  <div class="loader-text">読み込み中<span class="loader-dot">_</span></div>

<!-- Confirm dialog -->

  <div class="dialog">
    <h3 id="dlg-title">確認</h3>
    <p id="dlg-msg"></p>
    <div class="dialog-btns" id="dlg-btns"></div>
  </div>
</div>

  <span class="logo-sub">EDITOR</span>
  <div style="width:1px;height:18px;background:var(--bdr);margin:0 2px;"></div>
  <span class="badge badge-g">統合版専用</span>
  <span class="badge badge-b">JSZip</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════════════
//  Globals
// ══════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const ESC = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const enc = new TextEncoder(), dec = new TextDecoder('utf-8',{fatal:false});

// All loaded worlds: [{name, zip, files}]
// files: Map<entryPath, {data: Uint8Array|null, dirty, isNew, deleted}>
const WORLDS = [];
let activeWorld = -1;      // index into WORLDS
let selectedPath = null;   // currently selected path in tree
let addTargetDir = null;   // dir path for the add-row
let renameTargetPath = null;

// Open tabs: [{path, dirty}]
const openTabs = [];
let activeTab = null;

// Modified flag
let globalDirty = false;

// ══════════════════════════════════════════════════
//  File type helpers
// ══════════════════════════════════════════════════
function fileExt(name) {
  const parts = name.toLowerCase().split('.');
  return parts.length > 1 ? parts[parts.length-1] : '';
}
function fileCategory(name) {
  const e = fileExt(name), l = name.toLowerCase();
  if (['png','jpg','jpeg','gif','webp','bmp','tga'].includes(e)) return 'img';
  if (['json','jsonc','mcmeta'].includes(e)) return 'json';
  if (l === 'level.dat' || l.endsWith('.dat')) return 'dat';
  if (['txt','md','lang','cfg','ini','properties','mcfunction','mcscript','js','ts'].includes(e)) return 'txt';
  if (['ldb','sst','log'].includes(e) || l === 'current' || l.startsWith('manifest-')) return 'db';
  if (['mcpack','mcworld','mcaddon','zip'].includes(e)) return 'zip';
  return 'bin';
}
function icoClass(name, isDir) {
  if (isDir) return 'ico-dir';
  const cat = fileCategory(name);
  return {img:'ico-img',json:'ico-json',dat:'ico-dat',txt:'ico-txt',db:'ico-db',zip:'ico-zip',bin:'ico-bin'}[cat] || 'ico-bin';
}
function icoLabel(name, isDir) {
  if (isDir) return 'DIR';
  const cat = fileCategory(name);
  return {img:'IMG',json:'{}',dat:'NBT',txt:'TXT',db:'DB',zip:'ZIP',bin:'BIN'}[cat] || 'BIN';
}
function fmtSize(n) {
  if (!n && n!==0) return '';
  if (n < 1024) return n+'B';
  if (n < 1048576) return (n/1024).toFixed(1)+'KB';
  return (n/1048576).toFixed(1)+'MB';
}

// ══════════════════════════════════════════════════
//  Loader / status
// ══════════════════════════════════════════════════
function showLoader(msg='') { $('loader').classList.add('show'); $('loader-sub').textContent=msg; }
function hideLoader()       { $('loader').classList.remove('show'); }
function setStatus(msg, type='') {
  const el = $('status-msg');
  el.textContent = msg;
  el.style.color = type==='err' ? 'var(--red)' : type==='ok' ? 'var(--grn)' : 'var(--grn)';
}
function setDirty(dirty) {
  globalDirty = dirty;
  $('status-mod').classList.toggle('show', dirty);
}

// ══════════════════════════════════════════════════
//  Confirm dialog
// ══════════════════════════════════════════════════
function confirm2(title, msg) {
  return new Promise(res => {
    $('dlg-title').textContent = title;
    $('dlg-msg').textContent   = msg;
    const btns = $('dlg-btns');
    btns.innerHTML = '';
    const yes = mkBtn('削除する', 'danger');
    const no  = mkBtn('キャンセル', '');
    const close = ok => { $('dialog-bg').classList.remove('show'); res(ok); };
    yes.onclick = () => close(true);
    no.onclick  = () => close(false);
    btns.appendChild(no); btns.appendChild(yes);
    $('dialog-bg').classList.add('show');
  });
}
function mkBtn(label, type) {
  const b = document.createElement('button');
  b.className = 'ebtn' + (type ? ' '+type : '');
  b.textContent = label;
  return b;
}

// ══════════════════════════════════════════════════
//  World loading
// ══════════════════════════════════════════════════
$('file-input').addEventListener('change', e => {
  handleFiles(Array.from(e.target.files));
  e.target.value = '';
});
const uz = $('upload-zone');
uz.addEventListener('dragover',  e => { e.preventDefault(); uz.classList.add('drag'); });
uz.addEventListener('dragleave', () => uz.classList.remove('drag'));
uz.addEventListener('drop', e => {
  e.preventDefault(); uz.classList.remove('drag');
  handleFiles(Array.from(e.dataTransfer.files));
});

async function handleFiles(files) {
  for (const f of files) {
    const lower = f.name.toLowerCase();
    if (lower.endsWith('.mcworld') || lower.endsWith('.zip') || lower.endsWith('.mcpack') || lower.endsWith('.mcaddon')) {
      await loadWorld(f);
    } else {
      // Treat individual files as additions to current world
      if (activeWorld < 0) { setStatus('ワールドを先に開いてください', 'err'); continue; }
      await addFileToWorld(activeWorld, f.name, await readFileAsBytes(f));
    }
  }
}

async function loadWorld(file) {
  showLoader(file.name + ' を読み込み中...');
  try {
    const ab = await readFileAsArrayBuffer(file);
    const zip = await JSZip.loadAsync(ab);
    const filesMap = new Map();
    const entries = Object.keys(zip.files).filter(k => !zip.files[k].dir);
    for (const path of entries) {
      filesMap.set(path, { data: null, dirty: false, isNew: false, deleted: false, _zip: zip.files[path] });
    }
    const w = { name: file.name, zip, files: filesMap, originalAB: ab };
    WORLDS.push(w);
    renderWorldDrop();
    selectWorld(WORLDS.length - 1);
    setStatus(file.name + ' を読み込みました');
  } catch(e) {
    setStatus('読み込みエラー: ' + e.message, 'err');
    console.error(e);
  } finally {
    hideLoader();
  }
}

async function ensureData(wi, path) {
  const entry = WORLDS[wi].files.get(path);
  if (!entry) return null;
  if (entry.data !== null) return entry.data;
  if (entry._zip) {
    const ab = await entry._zip.async('arraybuffer');
    entry.data = new Uint8Array(ab);
  }
  return entry.data;
}

function readFileAsArrayBuffer(f) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsArrayBuffer(f); });
}
function readFileAsBytes(f) {
  return readFileAsArrayBuffer(f).then(ab => new Uint8Array(ab));
}

// ══════════════════════════════════════════════════
//  World selector
// ══════════════════════════════════════════════════
function toggleWorldDrop() {
  const bar  = $('world-bar');
  const drop = $('world-drop');
  const open = drop.classList.toggle('open');
  bar.classList.toggle('open', open);
}
document.addEventListener('click', e => {
  if (!$('world-bar').contains(e.target)) {
    $('world-drop').classList.remove('open');
    $('world-bar').classList.remove('open');
  }
});

function renderWorldDrop() {
  const drop = $('world-drop');
  drop.innerHTML = '';
  if (!WORLDS.length) {
    const el = document.createElement('div');
    el.className = 'wdrop-none';
    el.textContent = '読み込まれたワールドがありません';
    drop.appendChild(el);
    return;
  }
  WORLDS.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'wdrop-item' + (i===activeWorld ? ' active' : '');
    el.innerHTML = `<svg class="icon" width="11" height="11" style="stroke:var(--grn)"><use href="#i-world"/></svg>${ESC(w.name)}`;
    el.onclick = () => { selectWorld(i); toggleWorldDrop(); };
    drop.appendChild(el);
  });
}

function selectWorld(i) {
  activeWorld = i;
  const w = WORLDS[i];
  $('world-name').textContent = w.name;
  renderWorldDrop();
  renderTree();
  setStatus('ワールド: ' + w.name);
  updateStatusInfo();
}

// ══════════════════════════════════════════════════
//  File tree rendering
// ══════════════════════════════════════════════════

// Build a nested dir structure from flat file paths
function buildDirTree(files) {
  const root = { name:'', path:'', children:new Map(), isDir:true, open:true };
  for (const [path, entry] of files) {
    if (entry.deleted) continue;
    const parts = path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const seg = parts[i];
      if (!node.children.has(seg)) {
        const dirPath = parts.slice(0,i+1).join('/') + '/';
        node.children.set(seg, { name:seg, path:dirPath, children:new Map(), isDir:true, open:true });
      }
      node = node.children.get(seg);
    }
    const fname = parts[parts.length-1];
    node.children.set(fname, { name:fname, path, isDir:false, entry });
  }
  return root;
}

// Keep open/closed state across re-renders
const dirOpenState = new Map();

function renderTree() {
  const scroll = $('tree-scroll');
  const empty  = $('tree-empty');
  if (activeWorld < 0) {
    empty.style.display = '';
    scroll.querySelectorAll('.tr-outer').forEach(e=>e.remove());
    return;
  }
  empty.style.display = 'none';
  // Remove old tree
  scroll.querySelectorAll('.tr-outer').forEach(e=>e.remove());
  const w = WORLDS[activeWorld];
  const root = buildDirTree(w.files);
  // Render children of root
  const frag = document.createDocumentFragment();
  renderDirChildren(root, frag, 0);
  scroll.appendChild(frag);
  updateStatusInfo();
}

function renderDirChildren(dirNode, container, depth) {
  const entries = [...dirNode.children.entries()]
    .sort(([an,a],[bn,b]) => {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      return an.toLowerCase().localeCompare(bn.toLowerCase());
    });
  for (const [, node] of entries) {
    if (node.isDir) {
      renderDirNode(node, container, depth);
    } else {
      renderFileNode(node, container, depth);
    }
  }
}

function renderDirNode(node, container, depth) {
  const outer = document.createElement('div');
  outer.className = 'tr-outer';
  // Restore open state
  if (dirOpenState.has(node.path)) node.open = dirOpenState.get(node.path);

  const row = document.createElement('div');
  row.className = 'tr';
  row.dataset.path = node.path;
  row.dataset.isdir = '1';

  // Indent
  const sp = document.createElement('span');
  sp.className = 'tr-sp';
  sp.style.width = (depth * 14 + 6) + 'px';
  row.appendChild(sp);

  // Arrow
  const arr = document.createElement('span');
  arr.className = 'tr-arr' + (node.open ? ' open' : '');
  arr.innerHTML = '▶';
  row.appendChild(arr);

  // Icon
  const ico = document.createElement('span');
  ico.className = 'tr-ico ico-dir';
  ico.textContent = 'DIR';
  row.appendChild(ico);

  // Name
  const nm = document.createElement('span');
  nm.className = 'tr-name';
  nm.textContent = node.name + '/';
  row.appendChild(nm);

  // Actions (appear on hover)
  const acts = document.createElement('div');
  acts.className = 'tr-acts';
  acts.innerHTML = `
    <button class="tr-act" title="ここにファイルを追加" onclick="showAddRow('${CSS.escape(node.path)}');event.stopPropagation()">
      <svg class="icon" width="9" height="9"><use href="#i-plus"/></svg>
    </button>
    <button class="tr-act del" title="フォルダを削除" onclick="deleteDir('${CSS.escape(node.path)}');event.stopPropagation()">
      <svg class="icon" width="9" height="9"><use href="#i-trash"/></svg>
    </button>`;
  row.appendChild(acts);

  // Children container
  const children = document.createElement('div');
  children.className = 'tr-children' + (node.open ? '' : ' collapsed');
  renderDirChildren(node, children, depth + 1);

  row.onclick = (e) => {
    if (e.target.closest('.tr-acts')) return;
    node.open = !node.open;
    dirOpenState.set(node.path, node.open);
    arr.classList.toggle('open', node.open);
    children.classList.toggle('collapsed', !node.open);
  };

  outer.appendChild(row);
  outer.appendChild(children);
  container.appendChild(outer);
}

function renderFileNode(node, container, depth) {
  const outer = document.createElement('div');
  outer.className = 'tr-outer';

  const row = document.createElement('div');
  row.className = 'tr' + (node.path === selectedPath ? ' sel' : '');
  row.dataset.path = node.path;

  // Indent (extra for files vs dirs at same level)
  const sp = document.createElement('span');
  sp.className = 'tr-sp';
  sp.style.width = (depth * 14 + 6 + 13) + 'px'; // +13 for arrow space
  row.appendChild(sp);

  // Icon
  const ico = document.createElement('span');
  ico.className = 'tr-ico ' + icoClass(node.name, false);
  ico.textContent = icoLabel(node.name, false);
  row.appendChild(ico);

  // Name
  const nm = document.createElement('span');
  nm.className = 'tr-name' + (node.entry.dirty ? ' dirty' : '') + (node.entry.isNew ? ' new' : '');
  nm.textContent = node.name;
  row.appendChild(nm);

  // Size
  if (node.entry.data) {
    const sz = document.createElement('span');
    sz.className = 'tr-sz';
    sz.textContent = fmtSize(node.entry.data.length);
    row.appendChild(sz);
  }

  // Actions
  const acts = document.createElement('div');
  acts.className = 'tr-acts';
  acts.innerHTML = `
    <button class="tr-act" title="名前変更" onclick="startRename('${CSS.escape(node.path)}');event.stopPropagation()">
      <svg class="icon" width="9" height="9"><use href="#i-rename"/></svg>
    </button>
    <button class="tr-act del" title="ファイルを削除" onclick="deleteFile('${CSS.escape(node.path)}');event.stopPropagation()">
      <svg class="icon" width="9" height="9"><use href="#i-trash"/></svg>
    </button>`;
  row.appendChild(acts);

  row.onclick = () => openFile(node.path);
  outer.appendChild(row);
  container.appendChild(outer);
}

function treeExpandAll() {
  if (activeWorld < 0) return;
  dirOpenState.forEach((_, k) => dirOpenState.set(k, true));
  document.querySelectorAll('.tr-children').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.tr-arr').forEach(el => el.classList.add('open'));
}
function treeCollapseAll() {
  if (activeWorld < 0) return;
  dirOpenState.forEach((_, k) => dirOpenState.set(k, false));
  document.querySelectorAll('.tr-children').forEach(el => el.classList.add('collapsed'));
  document.querySelectorAll('.tr-arr').forEach(el => el.classList.remove('open'));
}

// ══════════════════════════════════════════════════
//  Add file
// ══════════════════════════════════════════════════
function showAddRow(dirPath) {
  addTargetDir = dirPath;
  const row = $('add-row');
  const inp = $('add-input');
  row.classList.add('show');
  if (dirPath) {
    inp.placeholder = dirPath + 'filename.json';
    inp.value = dirPath;
  } else {
    inp.placeholder = '例: behavior_packs/pack/manifest.json';
    inp.value = '';
  }
  inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);
}
function hideAddRow() {
  $('add-row').classList.remove('show');
  $('add-input').value = '';
  addTargetDir = null;
}
function pickFileToAdd() {
  $('add-file-input').click();
}
$('add-file-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const base = addTargetDir || '';
  for (const f of files) {
    const path = base ? base + f.name : f.name;
    const bytes = await readFileAsBytes(f);
    if ($('add-input').value.trim() === '' || $('add-input').value === addTargetDir) {
      $('add-input').value = path;
    }
    await addFileToWorldByPath(activeWorld, path, bytes);
  }
  hideAddRow();
  e.target.value = '';
});
$('add-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') commitAdd();
  if (e.key === 'Escape') hideAddRow();
});
async function commitAdd() {
  const path = $('add-input').value.trim();
  if (!path || activeWorld < 0) return;
  const bytes = new Uint8Array(0);
  await addFileToWorldByPath(activeWorld, path, bytes);
  hideAddRow();
  openFile(path);
}
async function addFileToWorldByPath(wi, path, bytes) {
  const w = WORLDS[wi];
  if (w.files.has(path)) {
    // Overwrite
    const entry = w.files.get(path);
    entry.data = bytes;
    entry.dirty = true;
    entry.deleted = false;
  } else {
    w.files.set(path, { data: bytes, dirty: true, isNew: true, deleted: false, _zip: null });
  }
  renderTree();
  setDirty(true);
  setStatus('追加: ' + path.split('/').pop());
}
async function addFileToWorld(wi, name, bytes) {
  await addFileToWorldByPath(wi, name, bytes);
}

// ══════════════════════════════════════════════════
//  Delete
// ══════════════════════════════════════════════════
async function deleteFile(path) {
  const fname = path.split('/').pop();
  const ok = await confirm2('ファイルを削除', `"${fname}" を削除しますか？\nこの操作はワールドDL時に反映されます。`);
  if (!ok) return;
  const entry = WORLDS[activeWorld].files.get(path);
  if (entry) entry.deleted = true;
  // Close tab if open
  const ti = openTabs.findIndex(t => t.path === path);
  if (ti >= 0) closeTab(ti);
  renderTree();
  setDirty(true);
  setStatus('削除: ' + fname);
}
async function deleteDir(dirPath) {
  const name = dirPath.replace(/\/$/, '').split('/').pop();
  const ok = await confirm2('フォルダを削除', `"${name}/" フォルダ内のすべてのファイルを削除しますか？`);
  if (!ok) return;
  const w = WORLDS[activeWorld];
  let count = 0;
  for (const [p, entry] of w.files) {
    if (p.startsWith(dirPath)) {
      entry.deleted = true;
      count++;
      const ti = openTabs.findIndex(t => t.path === p);
      if (ti >= 0) closeTab(ti);
    }
  }
  renderTree();
  setDirty(true);
  setStatus(`${name}/ を削除しました (${count}ファイル)`);
}

// ══════════════════════════════════════════════════
//  Rename
// ══════════════════════════════════════════════════
function startRename(path) {
  renameTargetPath = path;
  const fname = path.split('/').pop();
  const inp = $('rename-input');
  inp.value = fname;
  $('rename-row').classList.add('show');
  inp.focus();
  const dot = fname.lastIndexOf('.');
  inp.setSelectionRange(0, dot > 0 ? dot : fname.length);
}
$('rename-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') commitRename();
  if (e.key === 'Escape') hideRenameRow();
});
function commitRename() {
  const newName = $('rename-input').value.trim();
  if (!newName || !renameTargetPath || activeWorld < 0) { hideRenameRow(); return; }
  const w = WORLDS[activeWorld];
  const oldPath = renameTargetPath;
  const dir = oldPath.includes('/') ? oldPath.substring(0, oldPath.lastIndexOf('/')+1) : '';
  const newPath = dir + newName;
  if (newPath === oldPath) { hideRenameRow(); return; }
  if (w.files.has(newPath)) { setStatus('同名のファイルが既に存在します', 'err'); return; }
  // Move entry
  const entry = w.files.get(oldPath);
  w.files.delete(oldPath);
  w.files.set(newPath, { ...entry, dirty: true });
  // Update open tabs
  const ti = openTabs.findIndex(t => t.path === oldPath);
  if (ti >= 0) {
    openTabs[ti].path = newPath;
    if (activeTab === oldPath) activeTab = newPath;
  }
  renameTargetPath = null;
  hideRenameRow();
  renderTree();
  renderTabs();
  setDirty(true);
  setStatus('名前変更: ' + newName);
}
function hideRenameRow() {
  $('rename-row').classList.remove('show');
  renameTargetPath = null;
}

// ══════════════════════════════════════════════════
//  Tabs
// ══════════════════════════════════════════════════
function renderTabs() {
  const tabsEl = $('tabs');
  tabsEl.innerHTML = '';
  if (!openTabs.length) {
    const hint = document.createElement('span');
    hint.className = 'tabs-hint';
    hint.textContent = 'ファイルを選択してください';
    tabsEl.appendChild(hint);
    return;
  }
  openTabs.forEach((t, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (t.path === activeTab ? ' act' : '');
    const fname = t.path.split('/').pop();
    const cat = fileCategory(fname);
    const dotColor = {json:'var(--blu)',img:'var(--grn)',dat:'var(--pur)',txt:'#79c0ff',db:'var(--pur)',bin:'var(--mut)',zip:'var(--cya)'}[cat]||'var(--mut)';
    tab.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;display:inline-block"></span><span>${ESC(fname)}${t.dirty?'<span style="color:var(--yel);margin-left:2px">●</span>':''}</span>`;
    const cls = document.createElement('button');
    cls.className = 'tab-close';
    cls.innerHTML = '✕';
    cls.title = 'タブを閉じる';
    cls.onclick = (e) => { e.stopPropagation(); closeTab(i); };
    tab.appendChild(cls);
    tab.onclick = () => activateTab(t.path);
    tabsEl.appendChild(tab);
  });
}

function openFile(path) {
  selectedPath = path;
  // Update tree selection
  document.querySelectorAll('.tr').forEach(r => r.classList.toggle('sel', r.dataset.path === path));
  // Add tab if not open
  if (!openTabs.find(t => t.path === path)) {
    openTabs.push({ path, dirty: false });
  }
  activateTab(path);
}

function activateTab(path) {
  activeTab = path;
  renderTabs();
  showFileContent(path);
}

function closeTab(i) {
  const path = openTabs[i].path;
  openTabs.splice(i, 1);
  if (activeTab === path) {
    activeTab = openTabs.length ? openTabs[Math.min(i, openTabs.length-1)].path : null;
  }
  renderTabs();
  if (activeTab) showFileContent(activeTab);
  else clearEditor();
}

// ══════════════════════════════════════════════════
//  Editor content
// ══════════════════════════════════════════════════
function clearEditor() {
  $('editor-area').innerHTML = `
    <div class="welcome" id="welcome-view">
      <svg class="icon" width="44" height="44" style="stroke:var(--dim)"><use href="#i-world"/></svg>
      <h2>NO FILE</h2>
      <p>ファイルを選択してください</p>
    </div>`;
  $('etoolbar').classList.add('hide');
  $('ebar').className = 'ebar';
}

async function showFileContent(path) {
  if (activeWorld < 0) return;
  const w  = WORLDS[activeWorld];
  const entry = w.files.get(path);
  if (!entry) return;

  showLoader('読み込み中: ' + path.split('/').pop());
  const data = await ensureData(activeWorld, path);
  hideLoader();

  const fname = path.split('/').pop();
  const cat   = fileCategory(fname);
  const area  = $('editor-area');
  const tb    = $('etoolbar');
  const ebar  = $('ebar');

  // Reset error bar
  ebar.className = 'ebar';
  ebar.textContent = '';

  // Build toolbar
  tb.classList.remove('hide');
  tb.innerHTML = `<span class="epath">/<span>${ESC(path)}</span></span>`;

  // Build view based on category
  if (cat === 'json') {
    buildTextEditor(area, tb, ebar, path, entry, data, true);
  } else if (cat === 'txt') {
    buildTextEditor(area, tb, ebar, path, entry, data, false);
  } else if (cat === 'img') {
    buildImageView(area, tb, ebar, path, entry, data);
  } else if (cat === 'dat') {
    buildDatView(area, tb, ebar, path, entry, data);
  } else if (cat === 'db') {
    buildDbView(area, tb, ebar, path, entry, data);
  } else {
    buildBinaryView(area, tb, ebar, path, entry, data);
  }
}

// ── Text / JSON editor ──────────────────────────
function buildTextEditor(area, tb, ebar, path, entry, data, isJson) {
  const text = data ? dec.decode(data) : '';

  // Toolbar buttons
  const saveBtn = mkBtn('保存', 'prim');
  saveBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-save"/></svg> 保存`;
  const dlBtn = mkBtn('DL', '');
  dlBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-dl"/></svg> DL`;
  tb.appendChild(mkSep());
  tb.appendChild(saveBtn);
  if (isJson) {
    const fmtBtn = mkBtn('整形', '');
    fmtBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-fmt"/></svg> 整形`;
    const minBtn = mkBtn('圧縮', '');
    minBtn.textContent = '{ } 圧縮';
    tb.appendChild(mkSep());
    tb.appendChild(fmtBtn);
    tb.appendChild(minBtn);
    fmtBtn.onclick = () => {
      try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); validateJson(ta.value); }
      catch(e) { showEbar(ebar, 'JSON エラー: '+e.message, 'err'); }
    };
    minBtn.onclick = () => {
      try { ta.value = JSON.stringify(JSON.parse(ta.value)); validateJson(ta.value); }
      catch(e) { showEbar(ebar, 'JSON エラー: '+e.message, 'err'); }
    };
  }
  tb.appendChild(mkSep());
  tb.appendChild(dlBtn);

  // Textarea
  area.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'text-editor';
  ta.spellcheck = false;
  ta.autocomplete = 'off';
  ta.autocorrect = 'off';
  ta.value = text;
  if (isJson && text.trim()) validateJson(text, ebar);

  ta.addEventListener('input', () => {
    const bytes = enc.encode(ta.value);
    entry.data = bytes;
    entry.dirty = true;
    markTabDirty(path);
    setDirty(true);
    if (isJson) validateJson(ta.value, ebar);
  });

  saveBtn.onclick = () => {
    entry.data = enc.encode(ta.value);
    entry.dirty = true;
    setDirty(true);
    showEbar(ebar, '保存しました (ワールドDLで反映)', 'ok');
    setTimeout(() => { if (ebar.classList.contains('ok')) ebar.className='ebar'; }, 2000);
  };
  dlBtn.onclick = () => dlBytes(enc.encode(ta.value), path.split('/').pop());

  area.appendChild(ta);
  ta.focus();
}

function validateJson(text, ebar) {
  if (!ebar) return;
  try { JSON.parse(text); ebar.className='ebar'; }
  catch(e) { showEbar(ebar, '⚠ JSON 構文エラー: '+e.message, 'err'); }
}
function showEbar(ebar, msg, type) {
  ebar.textContent = msg;
  ebar.className = 'ebar ' + (type||'');
}

// ── Image viewer ────────────────────────────────
function buildImageView(area, tb, ebar, path, entry, data) {
  // Replace button
  const replBtn = mkBtn('差し替え', '');
  replBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-img"/></svg> 画像差し替え`;
  const replInput = document.createElement('input');
  replInput.type = 'file';
  replInput.accept = 'image/*';
  replInput.style.display = 'none';
  const dlBtn = mkBtn('DL', '');
  dlBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-dl"/></svg> DL`;

  replBtn.onclick = () => replInput.click();
  replInput.onchange = async () => {
    if (!replInput.files[0]) return;
    const bytes = await readFileAsBytes(replInput.files[0]);
    entry.data = bytes;
    entry.dirty = true;
    markTabDirty(path);
    setDirty(true);
    buildImageView(area, tb, ebar, path, entry, bytes);
    replInput.value = '';
    showEbar(ebar, '画像を差し替えました', 'ok');
    renderTree();
  };
  dlBtn.onclick = () => { if (data) dlBytes(data, path.split('/').pop()); };

  tb.appendChild(mkSep());
  tb.appendChild(replBtn);
  tb.appendChild(replInput);
  tb.appendChild(mkSep());
  tb.appendChild(dlBtn);

  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'img-view';

  if (data && data.length) {
    const blob = new Blob([data]);
    const url  = URL.createObjectURL(blob);
    const img  = document.createElement('img');
    img.src = url;
    img.alt = path.split('/').pop();
    img.style.maxWidth = '320px';
    img.style.maxHeight = '280px';
    const meta = document.createElement('div');
    meta.className = 'img-meta';
    img.onload = () => {
      meta.textContent = `${img.naturalWidth} × ${img.naturalHeight} px  •  ${fmtSize(data.length)}`;
      URL.revokeObjectURL(url);
    };
    wrap.appendChild(img);
    wrap.appendChild(meta);
  } else {
    wrap.innerHTML = `<div style="color:var(--mut);font-size:10px">空ファイルです</div>`;
  }
  area.appendChild(wrap);
}

// ── NBT / .dat viewer (WASM-powered) ────────────
function buildDatView(area, tb, ebar, path, entry, data) {
  // ── Toolbar ──
  const saveBtn = mkBtn('保存', 'prim');
  saveBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-save"/></svg> 保存`;
  const dlBtn = mkBtn('DL', '');
  dlBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-dl"/></svg> DL`;
  dlBtn.onclick = () => { if (entry.data) dlBytes(entry.data, path.split('/').pop()); };
  const replBtn = mkBtn('差し替え', '');
  replBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-edit"/></svg> ファイル差替`;
  const ri = document.createElement('input');
  ri.type='file'; ri.style.display='none';
  ri.onchange = async () => {
    if (!ri.files[0]) return;
    entry.data = await readFileAsBytes(ri.files[0]);
    entry.dirty = true; markTabDirty(path); setDirty(true);
    buildDatView(area, tb, ebar, path, entry, entry.data);
    ri.value=''; renderTree();
  };
  replBtn.onclick = () => ri.click();
  const expBtn = mkBtn('展開', '');
  expBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-expand"/></svg>`;
  expBtn.title = '全展開';
  const colBtn = mkBtn('折り畳み', '');
  colBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-collapse"/></svg>`;
  colBtn.title = '全折り畳み';
  tb.appendChild(mkSep()); tb.appendChild(saveBtn);
  tb.appendChild(mkSep()); tb.appendChild(expBtn); tb.appendChild(colBtn);
  tb.appendChild(mkSep()); tb.appendChild(dlBtn);
  tb.appendChild(mkSep()); tb.appendChild(replBtn); tb.appendChild(ri);

  area.innerHTML = '';

  if (!data || !data.length) {
    area.innerHTML = '<div class="nbt-panel"><div style="color:var(--mut);font-size:10px">空ファイルです</div></div>';
    return;
  }

  // Parse NBT
  let nbtRoot = null, nbtVer = 8, parseErr = null;
  const fname = path.split('/').pop().toLowerCase();
  try {
    if (fname === 'level.dat' || fname.endsWith('.dat')) {
      // Bedrock: 8-byte header [version:u32le][payloadSize:u32le] then LE-NBT
      if (data.length >= 8) {
        const dv2 = new DataView(data.buffer, data.byteOffset, data.byteLength);
        nbtVer = dv2.getUint32(0, true);
        const sz = dv2.getUint32(4, true);
        nbtRoot = nbtRead(data.slice(8, 8 + Math.min(sz, data.length - 8)));
      }
    } else {
      // Bare LE-NBT
      nbtRoot = nbtRead(data);
    }
  } catch(e) { parseErr = e.message; }

  if (parseErr || !nbtRoot) {
    const panel = document.createElement('div');
    panel.className = 'nbt-panel';
    panel.innerHTML = `<div style="color:var(--red);font-size:10px;margin-bottom:8px">NBT 解析エラー: ${ESC(parseErr||'不明なエラー')}</div>` + buildHexPreview(data, 256);
    area.appendChild(panel);
    return;
  }

  // Header info
  const infoDiv = document.createElement('div');
  infoDiv.style.cssText = 'padding:4px 8px;font-size:9px;color:var(--mut);border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;display:flex;gap:12px;align-items:center;';
  infoDiv.innerHTML = `<span style="color:var(--grn)">${ESC(fname)}</span><span>v${nbtVer}</span><span>${fmtSize(data.length)}</span><span style="color:var(--dim)">${nbtTypeName(nbtRoot.type)}: "${ESC(nbtRoot.name||'')}"</span>`;
  area.appendChild(infoDiv);

  // NBT tree container
  const treeDiv = document.createElement('div');
  treeDiv.className = 'nbt-panel';
  treeDiv.id = 'nbt-tree-' + path.replace(/[^a-z0-9]/gi,'_');
  area.appendChild(treeDiv);

  // Persist changes: when user edits, re-serialize and update entry.data
  const onMod = () => {
    try {
      const payload = nbtWrite(nbtRoot);
      if (fname === 'level.dat' || fname.endsWith('.dat')) {
        const out = new Uint8Array(8 + payload.length);
        new DataView(out.buffer).setUint32(0, nbtVer, true);
        new DataView(out.buffer).setUint32(4, payload.length, true);
        out.set(payload, 8);
        entry.data = out;
      } else {
        entry.data = payload;
      }
      entry.dirty = true; markTabDirty(path); setDirty(true); renderTree();
      showEbar(ebar, '変更済み（保存でファイルに反映）', 'ok');
    } catch(e) { showEbar(ebar, 'シリアライズエラー: '+e.message, 'err'); }
  };
  saveBtn.onclick = () => {
    onMod();
    showEbar(ebar, '保存しました (ワールドDLで反映)', 'ok');
    setTimeout(() => { if (ebar.classList.contains('ok')) ebar.className='ebar'; }, 2000);
  };

  nbtRenderNode(nbtRoot, treeDiv, onMod, null, -1);

  expBtn.onclick = () => {
    treeDiv.querySelectorAll('.nbt-ch.collapsed').forEach(el => el.classList.remove('collapsed'));
    treeDiv.querySelectorAll('.nbt-arr').forEach(el => { el.textContent='▼'; el.dataset.open='1'; });
  };
  colBtn.onclick = () => {
    treeDiv.querySelectorAll('.nbt-ch').forEach(el => el.classList.add('collapsed'));
    treeDiv.querySelectorAll('.nbt-arr').forEach(el => { el.textContent='▶'; el.dataset.open='0'; });
  };
}

// ── DB / LevelDB viewer (WASM Snappy + block parsing) ──
function buildDbView(area, tb, ebar, path, entry, data) {
  const dlBtn = mkBtn('DL', '');
  dlBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-dl"/></svg> DL`;
  dlBtn.onclick = () => { if (data) dlBytes(data, path.split('/').pop()); };
  tb.appendChild(mkSep()); tb.appendChild(dlBtn);

  area.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'nbt-panel';

  const fname = path.split('/').pop().toLowerCase();
  let html = `<div class="nbt-kv">
    <div class="nbt-k">ファイル名</div><div class="nbt-v s">${ESC(fname)}</div>
    <div class="nbt-k">サイズ</div><div class="nbt-v n">${data ? fmtSize(data.length) : '—'}</div>
  </div>`;

  // Try to parse SSTable with WASM if available and it's an .ldb file
  if (data && data.length > 48 && (fname.endsWith('.ldb') || fname.endsWith('.sst')) && WB) {
    try {
      const entries = ldbReadSSTable(data);
      html += `<div style="margin:8px 0 4px;font-size:9px;color:var(--mut)">SSTable: <span style="color:var(--grn)">${entries.length}</span> エントリ</div>`;
      html += `<table style="width:100%;border-collapse:collapse;font-size:9px">
        <tr style="color:var(--mut);border-bottom:1px solid var(--bdr)"><th style="text-align:left;padding:2px 6px">キー</th><th style="text-align:left;padding:2px 6px">サイズ</th><th style="text-align:left;padding:2px 6px">種別</th></tr>`;
      const MAX = 200;
      entries.slice(0, MAX).forEach(({key, val}) => {
        let ks; try { ks = dec.decode(key); } catch(_) { ks = hexOf(key); }
        if (ks.length > 40) ks = ks.slice(0,40)+'…';
        const cls = WB.classifyKey(key);
        const badge = cls.type==='chunk'
          ? `<span style="color:var(--grn);font-size:8px">CH(${cls.x},${cls.z})</span>`
          : cls.type==='player'
            ? `<span style="color:var(--ora);font-size:8px">${cls.ptype==='host'?'HOST':'GUEST'}</span>`
            : `<span style="color:var(--dim);font-size:8px">—</span>`;
        html += `<tr style="border-bottom:1px solid var(--bdr)">
          <td style="padding:2px 6px;color:var(--txt);font-size:9px">${ESC(ks)}</td>
          <td style="padding:2px 6px;color:var(--mut)">${val.length}B</td>
          <td style="padding:2px 6px">${badge}</td></tr>`;
      });
      if (entries.length > MAX) html += `<tr><td colspan="3" style="padding:3px 6px;color:var(--dim);font-size:9px">…${entries.length-MAX}件省略</td></tr>`;
      html += '</table>';
    } catch(e) {
      html += `<div class="nbt-notice" style="border-color:var(--red)">SSTable 解析エラー: ${ESC(e.message)}</div>`;
      html += buildHexPreview(data, 128);
    }
  } else if (data && fname.endsWith('.log') && WB) {
    // Log file: show WriteBatch record count
    try {
      const recs = ldbReadLogRecords(data);
      let ops = 0;
      recs.forEach(r => { ops += ldbParseWriteBatch(r).length; });
      html += `<div style="margin:8px 0 4px;font-size:9px;color:var(--mut)">Log レコード: <span style="color:var(--grn)">${recs.length}</span>　WriteBatch ops: <span style="color:var(--grn)">${ops}</span></div>`;
      html += buildHexPreview(data, 256);
    } catch(e) {
      html += `<div class="nbt-notice">Log 解析エラー: ${ESC(e.message)}</div>`;
      html += buildHexPreview(data, 128);
    }
  } else {
    html += `<div class="nbt-notice" style="border-color:var(--bdr2)">
      ${WB ? '対応外のDBファイル形式です。' : '<b>mc-bedrock.wasm</b> が見つかりません。同じフォルダに置くとSSTable/Logの解析が有効になります。'}
    </div>`;
    html += data ? buildHexPreview(data, 256) : '';
  }

  panel.innerHTML = html;
  area.appendChild(panel);
}

// ── Binary / unknown ────────────────────────────
function buildBinaryView(area, tb, ebar, path, entry, data) {
  const dlBtn = mkBtn('DL', '');
  dlBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-dl"/></svg> DL`;
  dlBtn.onclick = () => { if (data) dlBytes(data, path.split('/').pop()); };
  const replBtn = mkBtn('差し替え', '');
  replBtn.innerHTML = `<svg class="icon" width="10" height="10"><use href="#i-edit"/></svg> ファイル差替`;
  const ri = document.createElement('input');
  ri.type='file'; ri.style.display='none';
  ri.onchange = async () => {
    if (!ri.files[0]) return;
    entry.data = await readFileAsBytes(ri.files[0]);
    entry.dirty = true; markTabDirty(path); setDirty(true);
    buildBinaryView(area, tb, ebar, path, entry, entry.data);
    ri.value='';
    showEbar(ebar, 'ファイルを差し替えました', 'ok');
    renderTree();
  };
  replBtn.onclick = () => ri.click();
  tb.appendChild(mkSep()); tb.appendChild(dlBtn); tb.appendChild(mkSep()); tb.appendChild(replBtn); tb.appendChild(ri);

  area.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'hex-view';
  view.innerHTML = data ? buildHexPreview(data, 512) : '<div style="color:var(--mut);font-size:10px">空ファイルです</div>';
  area.appendChild(view);
}

function buildHexPreview(data, maxBytes) {
  if (!data || !data.length) return '';
  let html = '<div style="font-size:9px;color:var(--dim);margin-bottom:4px">HEX プレビュー</div>';
  const limit = Math.min(data.length, maxBytes);
  for (let off = 0; off < limit; off += 16) {
    const chunk = data.slice(off, off+16);
    const hexStr = [...chunk].map(b => b.toString(16).padStart(2,'0')).join(' ');
    const ascStr = [...chunk].map(b => b>=32&&b<127 ? String.fromCharCode(b) : '.').join('');
    html += `<div class="hex-row">
      <span class="hex-off">${off.toString(16).padStart(4,'0')}</span>
      <span class="hex-bytes">${ESC(hexStr)}</span>
      <span class="hex-ascii">${ESC(ascStr)}</span>
    </div>`;
  }
  if (data.length > maxBytes) {
    html += `<div style="color:var(--dim);font-size:9px;margin-top:4px">… ${fmtSize(data.length - maxBytes)} 省略 (合計 ${fmtSize(data.length)})</div>`;
  }
  return html;
}

// ── Toolbar helpers ──────────────────────────────
function mkSep() {
  const s = document.createElement('div'); s.className='esep'; return s;
}

// ══════════════════════════════════════════════════
//  Tab dirty state
// ══════════════════════════════════════════════════
function markTabDirty(path) {
  const tab = openTabs.find(t => t.path===path);
  if (tab) { tab.dirty = true; renderTabs(); }
}

// ══════════════════════════════════════════════════
//  World download
// ══════════════════════════════════════════════════
async function downloadWorld() {
  if (activeWorld < 0) { setStatus('ワールドが選択されていません', 'err'); return; }
  const w = WORLDS[activeWorld];
  showLoader('ワールドを再パック中...');
  try {
    // Clone the original ZIP
    const newZip = await JSZip.loadAsync(w.originalAB);
    // Apply changes
    for (const [path, entry] of w.files) {
      if (entry.deleted) {
        delete newZip.files[path];
        continue;
      }
      if (entry.dirty || entry.isNew) {
        if (entry.data !== null) {
          newZip.file(path, entry.data);
        }
      }
    }
    const blob = await newZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    dlBlob(blob, w.name);
    setStatus('ダウンロード完了: ' + w.name);
    setDirty(false);
  } catch(e) {
    setStatus('エラー: ' + e.message, 'err');
    console.error(e);
  } finally {
    hideLoader();
  }
}

// ══════════════════════════════════════════════════
//  Download helpers
// ══════════════════════════════════════════════════
function dlBytes(bytes, name) {
  dlBlob(new Blob([bytes], {type:'application/octet-stream'}), name);
}
function dlBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

//  Status info
// ══════════════════════════════════════════════════
function updateStatusInfo() {
  if (activeWorld < 0) { $('status-info').textContent = ''; return; }
  const w = WORLDS[activeWorld];
  let total = 0, deleted = 0, dirty = 0;
  for (const e of w.files.values()) {
    if (e.deleted) deleted++;
    else { total++; if (e.dirty || e.isNew) dirty++; }
  }
  $('status-info').textContent = `${total} ファイル${dirty ? '  ' + dirty + ' 変更' : ''}${deleted ? '  ' + deleted + ' 削除待ち' : ''}`;
}

// ══════════════════════════════════════════════════
//  WASM bridge  (mc-bedrock.wasm)
// ══════════════════════════════════════════════════
let WB = null; // null = not loaded, object = ready

async function initWasm() {
  try {
    const resp = await fetch('mc-bedrock.wasm');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const { instance } = await WebAssembly.instantiate(await resp.arrayBuffer());
    const ex = instance.exports;
    const mem = () => new Uint8Array(ex.memory.buffer);
    const dv2 = () => new DataView(ex.memory.buffer);
    WB = {
      write(b) { const p = ex.mem_alloc(b.length); mem().set(b, p); return p; },
      read(p, n) { return mem().slice(p, p + n); },
      reset() { ex.mem_reset(); },
      snappy(src) {
        ex.mem_reset();
        const sp = this.write(src);
        const dp = ex.mem_alloc(src.length * 4 + 65536);
        const n  = ex.snappy_decompress(sp, src.length, dp, src.length * 4 + 65536);
        if (n < 0) throw new Error('Snappy decompression failed');
        return this.read(dp, n);
      },
      ldbBlockEntries(block) {
        ex.mem_reset();
        const sp = this.write(block);
        const dmax = block.length * 3 + 65536;
        const dp   = ex.mem_alloc(dmax);
        const cnt  = ex.ldb_block_entries(sp, block.length, dp, dmax);
        if (cnt < 0) return [];
        const res = []; let pos = dp; const d = dv2();
        for (let i = 0; i < cnt; i++) {
          const kl = d.getUint32(pos, true); pos += 4;
          const vl = d.getUint32(pos, true); pos += 4;
          res.push({ key: this.read(pos, kl), val: this.read(pos + kl, vl) });
          pos += kl + vl;
        }
        return res;
      },
      classifyKey(key) {
        ex.mem_reset();
        const kp = this.write(key), op = ex.mem_alloc(32);
        const t  = ex.classify_key(kp, key.length, op);
        if (t === 1) {
          const d = dv2();
          return { type:'chunk', x:d.getInt32(op,true), z:d.getInt32(op+4,true),
                   dim:d.getInt32(op+8,true), tag:mem()[op+12],
                   y:new Int8Array(ex.memory.buffer)[op+13], isSub:mem()[op+14]===1 };
        }
        if (t === 2) return { type:'player', ptype:'host' };
        if (t === 3) return { type:'player', ptype:'guest' };
        return { type:'other' };
      }
    };
    $('status-wasm').textContent = '⬡ WASM: 有効';
    $('status-wasm').style.color = 'var(--grn)';
    return true;
  } catch(e) {
    $('status-wasm').textContent = '⬡ WASM: なし (' + e.message + ')';
    return false;
  }
}

// ══════════════════════════════════════════════════
//  LevelDB helpers (use WASM for Snappy/block parse)
// ══════════════════════════════════════════════════
function u32le(b, p) { return (b[p]|(b[p+1]<<8)|(b[p+2]<<16)|(b[p+3]<<24))>>>0; }
function varintDec(b, p) {
  let lo=0,hi=0,s=0;
  for (let i=0;i<10&&p<b.length;i++,s+=7) {
    const x=b[p++];
    if(s<28)lo|=(x&127)<<s; else if(s<35){lo|=(x&127)<<s;hi|=(x&127)>>(32-s);}else hi|=(x&127)<<(s-32);
    if(!(x&128))break;
  }
  return { v:(lo>>>0)+(hi>>>0)*4294967296, p };
}
function hexOf(b) { let s=''; for(const x of b) s+=x.toString(16).padStart(2,'0'); return s; }

function ldbDecompressBlock(bytes, off, sz) {
  const raw = bytes.subarray(off, off+sz);
  const ct  = bytes[off+sz]; // compression type byte
  if (ct === 0) return raw.slice();
  const sn = WB ? WB.snappy.bind(WB) : () => { throw new Error('no WASM'); };
  if (ct === 1) return sn(raw);  // snappy
  throw new Error('Unsupported compression type: ' + ct);
}

function ldbReadSSTable(bytes) {
  if (!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  if (bytes.length < 48) throw new Error('Too small for SSTable');
  const foot = bytes.subarray(bytes.length - 48);
  let pos=0,r;
  r=varintDec(foot,pos);pos=r.p; r=varintDec(foot,pos);pos=r.p; // skip metaindex
  r=varintDec(foot,pos);const iOff=r.v;pos=r.p;
  r=varintDec(foot,pos);const iSz=r.v;
  const idxBlock = ldbDecompressBlock(bytes, iOff, iSz);
  const parseBlock = WB ? b => WB.ldbBlockEntries(b) : () => [];
  const result = [];
  for (const ie of parseBlock(idxBlock)) {
    let rr=varintDec(ie.val,0);const bO=rr.v;rr=varintDec(ie.val,rr.p);const bS=rr.v;
    if (bO+bS+5 > bytes.length) continue;
    let bd; try { bd = ldbDecompressBlock(bytes,bO,bS); } catch(_) { continue; }
    for (const be of parseBlock(bd)) result.push(be);
  }
  return result;
}

function ldbReadLogRecords(bytes) {
  if (!(bytes instanceof Uint8Array)) bytes = new Uint8Array(bytes);
  const recs=[]; let pend=null, pos=0;
  while (pos < bytes.length) {
    const rem = 32768 - (pos % 32768);
    if (rem < 7) { pos += rem; continue; }
    const dL = bytes[pos+4] | (bytes[pos+5]<<8);
    const type = bytes[pos+6];
    pos += 7;
    if (pos+dL > bytes.length) break;
    const data = bytes.subarray(pos, pos+dL).slice(); pos += dL;
    if (type===0){const bo=pos%32768;if(bo)pos+=32768-bo;pend=null;continue;}
    if (type===1){recs.push(data);pend=null;}
    else if (type===2){pend=[data];}
    else if (type===3&&pend){pend.push(data);}
    else if (type===4&&pend){
      pend.push(data);
      let tot=0;for(const f of pend)tot+=f.length;
      const full=new Uint8Array(tot);let off2=0;
      for(const f of pend){full.set(f,off2);off2+=f.length;}
      recs.push(full);pend=null;
    }
  }
  return recs;
}

function ldbParseWriteBatch(rec) {
  if (rec.length < 12) return [];
  const cnt = u32le(rec,8); const ops=[]; let pos=12;
  for (let i=0;i<cnt&&pos<rec.length;i++) {
    const tp=rec[pos++];
    let r=varintDec(rec,pos);const kL=r.v;pos=r.p;
    if (pos+kL>rec.length) break;
    const key=rec.slice(pos,pos+kL);pos+=kL;
    if(tp===1){r=varintDec(rec,pos);const vL=r.v;pos=r.p;if(pos+vL>rec.length)break;ops.push({type:'put',key,val:rec.slice(pos,pos+vL)});pos+=vL;}
    else if(tp===0){ops.push({type:'del',key});}
  }
  return ops;
}

// ══════════════════════════════════════════════════
//  NBT reader / writer  (Bedrock little-endian)
// ══════════════════════════════════════════════════
const NBT = {END:0,BYTE:1,SHORT:2,INT:3,LONG:4,FLOAT:5,DOUBLE:6,
             BYTE_ARRAY:7,STRING:8,LIST:9,COMPOUND:10,INT_ARRAY:11,LONG_ARRAY:12};
const NBT_NAMES = ['TAG_End','TAG_Byte','TAG_Short','TAG_Int','TAG_Long',
  'TAG_Float','TAG_Double','TAG_Byte_Array','TAG_String','TAG_List',
  'TAG_Compound','TAG_Int_Array','TAG_Long_Array'];
const NBT_ABBR  = ['END','BYTE','S16','INT','LONG','FLT','DBL',
  'B[]','STR','LIST','COMP','I[]','L[]'];

function nbtTypeName(t) { return NBT_NAMES[t] || ('TAG_'+t); }

class NbtReader {
  constructor(buf) {
    const ab = buf instanceof ArrayBuffer ? buf : buf.buffer.slice(buf.byteOffset, buf.byteOffset+buf.byteLength);
    this.dv = new DataView(ab); this.p = 0;
  }
  u8()  { return this.dv.getUint8(this.p++); }
  s8()  { return this.dv.getInt8(this.p++); }
  s16() { const v=this.dv.getInt16(this.p,true);this.p+=2;return v; }
  u16() { const v=this.dv.getUint16(this.p,true);this.p+=2;return v; }
  s32() { const v=this.dv.getInt32(this.p,true);this.p+=4;return v; }
  f32() { const v=this.dv.getFloat32(this.p,true);this.p+=4;return v; }
  f64() { const v=this.dv.getFloat64(this.p,true);this.p+=8;return v; }
  s64() {
    const lo=this.dv.getUint32(this.p,true),hi=this.dv.getInt32(this.p+4,true);
    this.p+=8; return BigInt.asIntN(64,(BigInt(hi)<<32n)|BigInt(lo));
  }
  str() { const n=this.u16(); const b=new Uint8Array(this.dv.buffer,this.p,n); this.p+=n; return dec.decode(b); }
  payload(t) {
    switch(t) {
      case NBT.BYTE:   return this.s8();
      case NBT.SHORT:  return this.s16();
      case NBT.INT:    return this.s32();
      case NBT.LONG:   return this.s64();
      case NBT.FLOAT:  return this.f32();
      case NBT.DOUBLE: return this.f64();
      case NBT.BYTE_ARRAY: { const n=this.s32();const a=[];for(let i=0;i<n;i++)a.push(this.s8());return a; }
      case NBT.STRING: return this.str();
      case NBT.LIST: {
        const et=this.u8(),n=this.s32(),items=[];
        for(let i=0;i<n;i++) items.push(this.payload(et));
        return {elemType:et,items};
      }
      case NBT.COMPOUND: {
        const ch=[];
        for(;;){const t2=this.u8();if(t2===0)break;ch.push({type:t2,name:this.str(),value:this.payload(t2)});}
        return ch;
      }
      case NBT.INT_ARRAY:  { const n=this.s32();const a=[];for(let i=0;i<n;i++)a.push(this.s32());return a; }
      case NBT.LONG_ARRAY: { const n=this.s32();const a=[];for(let i=0;i<n;i++)a.push(this.s64());return a; }
      default: throw new Error('Unknown NBT tag: '+t+' @ '+this.p);
    }
  }
  root() { const t=this.u8(),name=this.str(); return {type:t,name,value:this.payload(t)}; }
}

class NbtWriter {
  constructor() { this.buf=[]; }
  u8(v)  { this.buf.push(v&255); }
  s8(v)  { this.buf.push(v<0?v+256:v&255); }
  _w(n,fn,v){const a=new ArrayBuffer(n);fn(new DataView(a),v);for(const x of new Uint8Array(a))this.buf.push(x);}
  s16(v) { this._w(2,(d,v)=>d.setInt16(0,v,true),v); }
  u16(v) { this._w(2,(d,v)=>d.setUint16(0,v,true),v); }
  s32(v) { this._w(4,(d,v)=>d.setInt32(0,v,true),v); }
  f32(v) { this._w(4,(d,v)=>d.setFloat32(0,v,true),v); }
  f64(v) { this._w(8,(d,v)=>d.setFloat64(0,v,true),v); }
  s64(big){
    const u=BigInt.asUintN(64,BigInt.asIntN(64,big));
    const lo=Number(u&0xFFFFFFFFn),hi=Number((u>>32n)&0xFFFFFFFFn);
    const a=new ArrayBuffer(8);const d=new DataView(a);
    d.setUint32(0,lo,true);d.setInt32(4,hi,true);
    for(const x of new Uint8Array(a))this.buf.push(x);
  }
  str(s) { const e=enc.encode(s);this.u16(e.length);for(const c of e)this.buf.push(c); }
  payload(t,v) {
    switch(t){
      case NBT.BYTE:   this.s8(v);break;
      case NBT.SHORT:  this.s16(v);break;
      case NBT.INT:    this.s32(v);break;
      case NBT.LONG:   this.s64(v);break;
      case NBT.FLOAT:  this.f32(v);break;
      case NBT.DOUBLE: this.f64(v);break;
      case NBT.BYTE_ARRAY:  this.s32(v.length);for(const x of v)this.s8(x);break;
      case NBT.STRING: this.str(v);break;
      case NBT.LIST:
        this.u8(v.elemType);this.s32(v.items.length);
        for(const x of v.items)this.payload(v.elemType,x);break;
      case NBT.COMPOUND:
        for(const c of v){this.u8(c.type);this.str(c.name);this.payload(c.type,c.value);}
        this.u8(0);break;
      case NBT.INT_ARRAY:  this.s32(v.length);for(const x of v)this.s32(x);break;
      case NBT.LONG_ARRAY: this.s32(v.length);for(const x of v)this.s64(x);break;
    }
  }
  root(n) { this.u8(n.type);this.str(n.name);this.payload(n.type,n.value); }
  out() { return new Uint8Array(this.buf); }
}

function nbtRead(buf)  { return new NbtReader(buf).root(); }
function nbtWrite(node){ const w=new NbtWriter();w.root(node);return w.out(); }

// ══════════════════════════════════════════════════
//  NBT tree renderer
// ══════════════════════════════════════════════════
const PRIM_TAGS = new Set([NBT.BYTE,NBT.SHORT,NBT.INT,NBT.LONG,NBT.FLOAT,NBT.DOUBLE,NBT.STRING]);
const HAS_CHILDREN = new Set([NBT.COMPOUND,NBT.LIST,NBT.BYTE_ARRAY,NBT.INT_ARRAY,NBT.LONG_ARRAY]);

function nbtVal2Str(t,v) { return t===NBT.LONG ? v.toString() : String(v); }
function nbtStr2Val(t,s) {
  s=s.trim();
  switch(t){
    case NBT.BYTE: case NBT.SHORT: case NBT.INT: return parseInt(s)||0;
    case NBT.LONG:  try{return BigInt(s);}catch(_){return 0n;}
    case NBT.FLOAT: case NBT.DOUBLE: return parseFloat(s)||0;
    default: return s;
  }
}
function nbtMeta(t,v) {
  switch(t){
    case NBT.BYTE: return 'byte'; case NBT.SHORT: return 'short';
    case NBT.INT:  return 'int';  case NBT.LONG:  return 'long';
    case NBT.FLOAT:return 'float';case NBT.DOUBLE:return 'double';
    case NBT.BYTE_ARRAY:  return `[${v.length}B]`;
    case NBT.INT_ARRAY:   return `[${v.length}I]`;
    case NBT.LONG_ARRAY:  return `[${v.length}L]`;
    case NBT.LIST:        return `${v.items.length}×${NBT_ABBR[v.elemType]||'?'}`;
    case NBT.COMPOUND:    return `${v.length} tags`;
    default: return '';
  }
}
function nbtDefaultVal(t) {
  switch(t){
    case NBT.BYTE: case NBT.SHORT: case NBT.INT: return 0;
    case NBT.LONG:  return 0n;
    case NBT.FLOAT: case NBT.DOUBLE: return 0;
    case NBT.STRING: return '';
    case NBT.COMPOUND: return [];
    case NBT.LIST: return {elemType:NBT.INT,items:[]};
    default: return [];
  }
}

// Tag colour classes  t1..t12
const TTYPE_COLOURS = [
  '',                          // 0 END
  'nbt-t1','nbt-t2','nbt-t3', // 1 BYTE  2 SHORT  3 INT
  'nbt-t4','nbt-t5','nbt-t6', // 4 LONG  5 FLOAT  6 DOUBLE
  'nbt-t7','nbt-t8','nbt-t9', // 7 B[]   8 STR    9 LIST
  'nbt-t10','nbt-t11','nbt-t12' // 10 COMP 11 I[]  12 L[]
];

function nbtRenderNode(node, container, onMod, parentArr, parentIdx) {
  const hasCh = HAS_CHILDREN.has(node.type);
  const wrap  = document.createElement('div');
  wrap.className = 'nbt-node';

  const row = nbtMakeRow(node.type, node.name ?? null, false,
    () => node.value, v => { node.value=v; onMod(); },
    parentArr, parentIdx, wrap, container, onMod);
  wrap.appendChild(row.el);

  if (hasCh) {
    const ch = document.createElement('div');
    ch.className = 'nbt-ch';
    nbtRenderChildren(node.type, node.value, ch, onMod);
    if (node.type===NBT.COMPOUND || node.type===NBT.LIST) nbtAppendAddRow(ch, node, onMod);
    row.togBtn.onclick = () => {
      const open = row.togBtn.dataset.open !== '0';
      if (open) { ch.classList.add('collapsed'); row.togBtn.textContent='▶'; row.togBtn.dataset.open='0'; }
      else       { ch.classList.remove('collapsed'); row.togBtn.textContent='▼'; row.togBtn.dataset.open='1'; }
    };
    wrap.appendChild(ch);
  }
  container.appendChild(wrap);
}

function nbtRenderChildren(type, value, ch, om) {
  if (type===NBT.COMPOUND) {
    for (let i=0;i<value.length;i++) nbtRenderNode(value[i], ch, om, value, i);
  } else if (type===NBT.LIST) {
    const {elemType:et,items} = value;
    for (let i=0;i<items.length;i++) nbtRenderListItem(et, items, i, ch, om);
  } else {
    nbtRenderArray(type, value, ch, om);
  }
}

function nbtRenderListItem(et, items, i, par, om) {
  const hasCh = et===NBT.COMPOUND||et===NBT.LIST;
  const wrap  = document.createElement('div');
  wrap.className = 'nbt-node';
  const row = nbtMakeRow(et,'['+i+']',true,()=>items[i],v=>{items[i]=v;om();},items,i,wrap,par,om);
  wrap.appendChild(row.el);
  if (hasCh) {
    const ch = document.createElement('div');
    ch.className = 'nbt-ch';
    if (et===NBT.COMPOUND) for(let j=0;j<items[i].length;j++) nbtRenderNode(items[i][j],ch,om,items[i],j);
    else if (et===NBT.LIST) { const{elemType:e2,items:i2}=items[i];for(let j=0;j<i2.length;j++)nbtRenderListItem(e2,i2,j,ch,om);}
    if (et===NBT.COMPOUND||et===NBT.LIST) nbtAppendAddRow(ch,{type:et,value:items[i]},om);
    row.togBtn.onclick = () => {
      const open=row.togBtn.dataset.open!=='0';
      if(open){ch.classList.add('collapsed');row.togBtn.textContent='▶';row.togBtn.dataset.open='0';}
      else    {ch.classList.remove('collapsed');row.togBtn.textContent='▼';row.togBtn.dataset.open='1';}
    };
    wrap.appendChild(ch);
  }
  par.appendChild(wrap);
}

function nbtRenderArray(type, arr, par, om) {
  const it = type===NBT.LONG_ARRAY?NBT.LONG:(type===NBT.INT_ARRAY?NBT.INT:NBT.BYTE);
  const MAX = 64;
  for (let i=0;i<Math.min(arr.length,MAX);i++) {
    const idx=i;
    const row=nbtMakeRow(it,'['+idx+']',true,()=>arr[idx],v=>{arr[idx]=v;om();},arr,idx,null,par,om);
    par.appendChild(row.el);
  }
  if (arr.length>MAX){const m=document.createElement('div');m.style.cssText='padding:1px 6px;color:var(--dim);font-size:9px';m.textContent=`…${arr.length-MAX}件省略`;par.appendChild(m);}
}

function nbtMakeRow(type, nameTxt, isIndex, getter, setter, parentArr, parentIdx, wrap, parEl, om) {
  const hasCh = HAS_CHILDREN.has(type);
  const el = document.createElement('div');
  el.className = 'nbt-row';

  // Toggle arrow
  const togBtn = document.createElement('span');
  togBtn.className = 'nbt-arr';
  togBtn.dataset.open = '1';
  if (hasCh) togBtn.textContent = '▼';
  el.appendChild(togBtn);

  // Type badge
  const badge = document.createElement('span');
  badge.className = 'nbt-badge ' + (TTYPE_COLOURS[type]||'');
  badge.title = nbtTypeName(type);
  badge.textContent = NBT_ABBR[type]||'?';
  el.appendChild(badge);

  // Name
  if (nameTxt !== null && nameTxt !== undefined) {
    const nm = document.createElement('span');
    nm.className = isIndex ? 'nbt-idx' : 'nbt-name';
    nm.textContent = nameTxt;
    el.appendChild(nm);
    if (!isIndex) { const c=document.createElement('span');c.className='nbt-colon';c.textContent=':';el.appendChild(c); }
  }

  // Value / meta
  const valWrap = document.createElement('span');
  valWrap.className = 'nbt-val';
  if (PRIM_TAGS.has(type)) {
    const inp = document.createElement('input');
    inp.className = 'nbt-input';
    inp.spellcheck = false;
    inp.value = nbtVal2Str(type, getter());
    inp.addEventListener('input', () => { inp.classList.add('changed'); setter(nbtStr2Val(type, inp.value)); });
    valWrap.appendChild(inp);
  }
  const meta = document.createElement('span');
  meta.className = 'nbt-meta';
  meta.textContent = nbtMeta(type, getter());
  valWrap.appendChild(meta);
  el.appendChild(valWrap);

  // Delete button
  if (parentArr !== null && parentArr !== undefined && parentIdx !== -1) {
    const acts = document.createElement('div');
    acts.className = 'nbt-acts';
    const del = document.createElement('button');
    del.className = 'nbt-del';
    del.title = 'このタグを削除';
    del.innerHTML = `<svg class="icon" width="9" height="9"><use href="#i-x"/></svg>`;
    del.onclick = e => {
      e.stopPropagation();
      if (Array.isArray(parentArr)) parentArr.splice(parentIdx, 1);
      if (wrap && parEl) parEl.removeChild(wrap);
      om();
    };
    acts.appendChild(del);
    el.appendChild(acts);
  }

  return { el, togBtn };
}

function nbtAppendAddRow(container, parentNode, om) {
  const row = document.createElement('div');
  row.className = 'nbt-add-row';
  const isComp = parentNode.type === NBT.COMPOUND;

  const sel = document.createElement('select');
  sel.className = 'nbt-add-sel';
  [[1,'BYTE'],[2,'S16'],[3,'INT'],[4,'LONG'],[5,'FLOAT'],[6,'DOUBLE'],
   [7,'B[]'],[8,'STR'],[9,'LIST'],[10,'COMP'],[11,'I[]'],[12,'L[]']]
    .forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o);});
  if (!isComp) { sel.value=String(parentNode.value.elemType); sel.disabled=true; }

  const nameIn = document.createElement('input');
  nameIn.className = 'nbt-add-inp';
  nameIn.placeholder = isComp ? 'タグ名' : '';
  nameIn.style.width = '80px';

  const valIn = document.createElement('input');
  valIn.className = 'nbt-add-inp';
  valIn.placeholder = '値';
  valIn.style.width = '70px';

  const addBtn = document.createElement('button');
  addBtn.className = 'nbt-add-btn';
  addBtn.innerHTML = `<svg class="icon" width="9" height="9"><use href="#i-plus"/></svg>追加`;

  addBtn.onclick = () => {
    const t = parseInt(sel.value);
    let nv = nbtDefaultVal(t);
    if (PRIM_TAGS.has(t) && valIn.value.trim()) nv = nbtStr2Val(t, valIn.value);
    if (isComp) {
      const name = nameIn.value.trim() || '新タグ';
      parentNode.value.push({ type:t, name, value:nv });
      nbtRenderNode({ type:t, name, value:nv }, container, om, parentNode.value, parentNode.value.length-1);
      container.appendChild(row);
    } else {
      parentNode.value.items.push(nv);
      nbtRenderListItem(parentNode.value.elemType, parentNode.value.items, parentNode.value.items.length-1, container, om);
      container.appendChild(row);
    }
    nameIn.value=''; valIn.value=''; om();
  };

  if (isComp) { row.appendChild(sel); row.appendChild(nameIn); row.appendChild(valIn); }
  else        { row.appendChild(sel); row.appendChild(valIn); }
  row.appendChild(addBtn);
  container.appendChild(row);
}
